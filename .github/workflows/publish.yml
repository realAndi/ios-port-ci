name: build and publish repo

# Reusable. A port calls this instead of carrying its own copy, so a change here
# -- a deprecated action, a new hardening step -- reaches every port at once
# rather than being applied N times and forgotten in the N+1th.
#
# The port supplies three scripts and this supplies the orchestration around
# them. See CONTRACT.md.

on:
  workflow_call:
    inputs:
      package:
        description: "Package identifier, e.g. com.andi.github-cli"
        required: true
        type: string
      origin:
        description: "Release: Origin"
        required: true
        type: string
      label:
        description: "Release: Label"
        required: false
        type: string
        default: ""
      description:
        description: "Release: Description"
        required: false
        type: string
        default: "An iOS port, packaged for jailbroken devices"
      version:
        description: "Upstream version to build (blank = whatever resolve-version.sh discovers)"
        required: false
        type: string
        default: ""
      go-version:
        description: "Go toolchain for build-payload.sh, e.g. 'stable'. Blank = no Go set up."
        required: false
        type: string
        default: ""
      brew-packages:
        description: "Homebrew packages build-payload.sh needs, space separated, e.g. 'ldid'."
        required: false
        type: string
        default: ""
      needs-macos:
        description: "Does build-payload.sh need the iPhoneOS SDK, ldid or Xcode?"
        required: false
        type: boolean
        default: true
      payload-paths:
        description: "Newline-separated paths produced by build-payload.sh, passed between runners"
        required: false
        type: string
        default: |
          packaging/payload/
      key-file:
        description: "Filename the public key is published under, beside the index"
        required: false
        type: string
        default: key.gpg
      keep:
        description: "How many published versions to carry forward, for rollback"
        required: false
        type: number
        default: 10
      ci-ref:
        description: "Ref of realAndi/ios-port-ci to take shared tools from"
        required: false
        type: string
        default: v1
    secrets:
      GPG_KEY:
        description: "ASCII-armoured private key for this port. Absent = unsigned index."
        required: false
      GPG_KEY_ID:
        description: "Fingerprint of that key"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      revision: ${{ steps.v.outputs.revision }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only for base_url, so the check below asks the same host the publish
      # job will write to rather than guessing at github.io from the repo name.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v5.0.0
        id: pages
      - id: v
        env:
          WANTED: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          V="$(./tools/resolve-version.sh "$WANTED")"
          [ -n "$V" ] || { echo "resolve-version.sh produced nothing"; exit 1; }
          REV="$(cat packaging/revision)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

          # Is there anything to do? A scheduled run that would rebuild a
          # version-revision already on the site produces an identical package,
          # so apt offers nobody an upgrade -- it just burns a macOS runner and
          # redeploys Pages with a fresh signature. Skip it and the schedule can
          # be tightened to poll for new upstream releases often, which is the
          # point of the schedule in the first place.
          #
          # Only for `schedule`. A push changed the packaging and a
          # workflow_dispatch is someone asking for a rebuild on purpose; both
          # must build even when the version is unchanged.
          #
          # Fails open: if the index cannot be fetched -- first ever run, Pages
          # down, a new port with nothing published -- there is no evidence this
          # version exists, so build it. The wrong answer here is skipping a
          # release, not doing redundant work.
          BUILD=true
          if [ "$EVENT" = "schedule" ]; then
            if curl -fsSL --max-time 30 "${BASE%/}/Packages" 2>/dev/null \
               | grep -qxF "Version: $V-$REV"; then
              BUILD=false
            fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

          if [ "$BUILD" = true ]; then
            echo "building $V-$REV"
          else
            echo "$V-$REV is already published and this is a scheduled run -- nothing to do"
          fi

  payload:
    if: needs.resolve.outputs.build == 'true' 
    # Only this job may need macOS. Building a payload is the one step that can
    # require an iPhoneOS SDK or ldid, and the one step that differs
    # fundamentally between ports; everything after it is the same job every time.
    needs: resolve
    runs-on: ${{ inputs.needs-macos && 'macos-15' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shared tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: realAndi/ios-port-ci
          ref: ${{ inputs.ci-ref }}
          path: .ci
      # A payload build needs whatever its port needs and nothing more: Go for a
      # port that compiles, ldid for anything that has to be signed before iOS
      # will exec it. Declared per port rather than installed unconditionally,
      # so a port that needs neither does not pay for both.
      - name: Set up Go
        if: inputs.go-version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # No module cache: the sources being built are cloned inside
          # build-payload.sh, so there is no go.sum at a fixed path to key on.
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Install build tools
        if: inputs.brew-packages != ''
        run: brew install ${{ inputs.brew-packages }}

      - name: Build payload
        env:
          CI_TOOLS: ${{ github.workspace }}/.ci/tools
        run: |
          chmod +x .ci/tools/*.sh .ci/tools/*.py || true
          ./tools/build-payload.sh "${{ needs.resolve.outputs.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload
          path: ${{ inputs.payload-paths }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.resolve.outputs.build == 'true'
    needs: [resolve, payload]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shared tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: realAndi/ios-port-ci
          ref: ${{ inputs.ci-ref }}
          path: .ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: payload
          path: packaging/payload
      - name: Install dpkg tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      # Needed before the build so the control file knows the repo's own URL.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Build package
        env:
          CI_TOOLS: ${{ github.workspace }}/.ci/tools
          GH_REPO: ${{ github.repository }}
          GH_PAGES: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          chmod +x .ci/tools/*.sh .ci/tools/*.py || true
          ./tools/build-deb.sh "${{ needs.resolve.outputs.revision }}"

      - name: Carry forward already-published versions
        run: .ci/tools/fetch-published.sh "${{ steps.pages.outputs.base_url }}" "${{ inputs.keep }}" "${{ github.workspace }}/repo/debs"

      # Without this the index is unsigned and apt refuses it unless the source
      # line says [trusted=yes]. reallyitsandi.com pins this key's fingerprint,
      # so an unsigned index is also an index it will decline to sync.
      - name: Import signing key
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "::warning::GPG_KEY not set — the index will be published unsigned"
            exit 0
          fi
          printf '%s\n' "$GPG_KEY" | gpg --batch --quiet --import
          gpg --list-secret-keys --keyid-format=long | sed -n 's/^sec  /  key: /p'

      - name: Generate APT metadata
        env:
          REPO_ORIGIN: ${{ inputs.origin }}
          REPO_LABEL: ${{ inputs.label || inputs.origin }}
          REPO_DESCRIPTION: ${{ inputs.description }}
          REPO_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          REPO_KEY_FILE: ${{ inputs.key-file }}
        run: |
          cp packaging/depiction.html repo/depiction.html
          cp packaging/index.html     repo/index.html
          python3 .ci/tools/make-repo.py repo
          ls -la repo repo/debs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
